name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir project
          unzip -o BerKalkulatorAndroid_projekt.zip -d project

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -type f -printf '%h\n' | head -1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "HIBA: settings.gradle nem található!"
            find project -maxdepth 6 -print
            exit 1
          fi

          echo "Android projekt helye: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: berkalkulator-apk
          path: project/**/build/outputs/apk/**/*.apk
